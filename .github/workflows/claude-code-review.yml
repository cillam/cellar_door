name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR against the architectural rules in CLAUDE.md and the
            spec in SPEC.md. The PR title indicates which step of the build this
            is — scope your review to what that step actually delivers.

            Focus on correctness, security, and adherence to the project's
            stated conventions. Skip rules that reference code not yet in the
            repo — the project is under active initial development.

            Use inline comments for specific issues on specific lines. Use a
            top-level PR comment for overall observations. If the diff has no
            substantive issues, post a brief "no significant issues found"
            top-level comment rather than staying silent.