[project]
name = "cellar-door-backend"
version = "0.1.0"
description = "FastAPI + LangGraph backend for the Cellar Door inventory app."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    # JWT parsing/verification. Covers both this step's unverified stub
    # decode and step 5's real JWKS-based verification -- no library
    # swap needed later.
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    # Sync driver used only by alembic/env.py to run migrations.
    # Runtime queries always go through asyncpg (app/db.py).
    "psycopg[binary]>=3.2",
    # Spins up ephemeral Postgres containers for integration tests.
    # Requires Docker running locally.
    "testcontainers[postgres]>=4.8",
]

# Application, not a library — uv manages the environment without building
# or installing this project as a package.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008 ("no function calls in argument defaults") doesn't know FastAPI's
# Depends()/Query()/Header() etc. are meant to be called this way --
# it's the required, documented FastAPI DI pattern, not a bug. This is
# ruff's own documented fix for the false positive.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# asyncpg ships no type stubs / py.typed marker. Scoped to just this
# package rather than a blanket ignore_missing_imports, so a real
# untyped-import gap elsewhere still gets caught.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
